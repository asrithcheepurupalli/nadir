<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The mark is the definition: a horizon, an observer, and the point on the
       ground directly beneath. Reads at 16px because it is three shapes. -->
  <rect width="64" height="64" fill="#efe9db"/>
  <line x1="8" y1="24" x2="56" y2="24" stroke="#191b19" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="24" x2="32" y2="44" stroke="#191b19" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="32" cy="47" r="6" fill="#b8510e"/>
</svg>
